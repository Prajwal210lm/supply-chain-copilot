             {qty_ordered: 5,  qty_delivered: 5,  unit_price_aed: 40}]}
  - {order_id: ORD-2602-02, month: "2026-02", supplier: S1, dc: JEB, on_time: true,
     lines: [{qty_ordered: 20, qty_delivered: 20, unit_price_aed: 10},
             {qty_ordered: 10, qty_delivered: 10, unit_price_aed: 30}]}
  - {order_id: ORD-2602-03, month: "2026-02", supplier: S1, dc: AUH, on_time: true,
     lines: [{qty_ordered: 8,  qty_delivered: 8,  unit_price_aed: 25},
             {qty_ordered: 12, qty_delivered: 12, unit_price_aed: 25}]}
  - {order_id: ORD-2602-04, month: "2026-02", supplier: S1, dc: JEB, on_time: true,
     lines: [{qty_ordered: 15, qty_delivered: 15, unit_price_aed: 20}]}
  - {order_id: ORD-2602-05, month: "2026-02", supplier: S1, dc: AUH, on_time: true,
     lines: [{qty_ordered: 10, qty_delivered: 10, unit_price_aed: 10},
             {qty_ordered: 10, qty_delivered: 10, unit_price_aed: 20}]}
  - {order_id: ORD-2602-06, month: "2026-02", supplier: S1, dc: JEB, on_time: false,
     lines: [{qty_ordered: 25, qty_delivered: 25, unit_price_aed: 8},
             {qty_ordered: 10, qty_delivered: 10, unit_price_aed: 10}]}
  - {order_id: ORD-2602-07, month: "2026-02", supplier: S1, dc: AUH, on_time: false,
     lines: [{qty_ordered: 20, qty_delivered: 20, unit_price_aed: 10}]}
  - {order_id: ORD-2602-08, month: "2026-02", supplier: S2, dc: JEB, on_time: true,
     lines: [{qty_ordered: 10, qty_delivered: 10, unit_price_aed: 30},
             {qty_ordered: 10, qty_delivered: 10, unit_price_aed: 20}]}
  - {order_id: ORD-2602-09, month: "2026-02", supplier: S2, dc: AUH, on_time: true,
     lines: [{qty_ordered: 25, qty_delivered: 25, unit_price_aed: 20}]}
  - {order_id: ORD-2602-10, month: "2026-02", supplier: S2, dc: JEB, on_time: true,
     lines: [{qty_ordered: 10, qty_delivered: 10, unit_price_aed: 25}]}
  - {order_id: ORD-2602-11, month: "2026-02", supplier: S2, dc: AUH, on_time: true,
     lines: [{qty_ordered: 15, qty_delivered: 15, unit_price_aed: 10}]}
  - {order_id: ORD-2602-12, month: "2026-02", supplier: S2, dc: JEB, on_time: false,
     lines: [{qty_ordered: 10, qty_delivered: 10, unit_price_aed: 20},
             {qty_ordered: 20, qty_delivered: 20, unit_price_aed: 10},
             {qty_ordered: 10, qty_delivered: 10, unit_price_aed: 20}]}

  # ------------------------------ 2026-03 (12 orders, 20 lines)
  - {order_id: ORD-2603-01, month: "2026-03", supplier: S1, dc: JEB, on_time: true,
     lines: [{qty_ordered: 10, qty_delivered: 10, unit_price_aed: 20},
             {qty_ordered: 10, qty_delivered: 10, unit_price_aed: 10}]}
  - {order_id: ORD-2603-02, month: "2026-03", supplier: S1, dc: AUH, on_time: true,
     lines: [{qty_ordered: 10, qty_delivered: 10, unit_price_aed: 30},
             {qty_ordered: 20, qty_delivered: 0,  unit_price_aed: 10}]}   # zero-delivered line (the stockout)
  - {order_id: ORD-2603-03, month: "2026-03", supplier: S1, dc: JEB, on_time: true,
     lines: [{qty_ordered: 25, qty_delivered: 25, unit_price_aed: 20}]}
  - {order_id: ORD-2603-04, month: "2026-03", supplier: S1, dc: JEB, on_time: false,
     lines: [{qty_ordered: 10, qty_delivered: 10, unit_price_aed: 10},
             {qty_ordered: 10, qty_delivered: 10, unit_price_aed: 20}]}
