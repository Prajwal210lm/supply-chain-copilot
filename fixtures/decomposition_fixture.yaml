# decomposition_fixture.yaml — hand-math fixture for the metric layer and the
# supplier change_decomposition of otif_pct, 2026-02 -> 2026-03.
#
# hand_verified is false until the builder has re-derived every worksheet line
# with a calculator. DOWNSTREAM TESTS MUST REFUSE TO TREAT THIS FIXTURE AS
# PINNED WHILE hand_verified IS false (skip or fail loudly; never assert
# against unverified expected values).
hand_verified: false

# Definitions pinned by this fixture (must match docs/SPEC.md):
# - Order grain: an order is on_time per its flag; in_full iff EVERY line has
#   qty_delivered == qty_ordered; OTIF iff on_time AND in_full.
# - Line grain (used for all supplier cuts of the OTIF family): a line is OTIF
#   iff its parent order is on_time AND the line's qty_delivered == qty_ordered.
# - fill_rate_pct is line grain by definition: sum(qty_delivered) / sum(qty_ordered).
# - revenue = DELIVERED value: sum(qty_delivered * unit_price_aed).
# - stockout_count (fixture-local operationalization) = number of order lines
#   with qty_delivered == 0.
#
# Construction constraints satisfied (verify before flipping the flag):
# - Order-grain OTIF: Feb exactly 75.0% (9 of 12), Mar exactly 50.0% (6 of 12).
# - Mix shift: S1 has 60% of lines in Feb, 40% in Mar. Deliberate deviation
#   from the suggested "roughly 45%": 9-of-20 lines would force x/9 OTIF rates
#   (no clean one-decimal values besides 0 and 100), while 8-of-20 keeps every
#   percentage clean AND strengthens the mix shift the fixture must catch.
# - 20 lines per month; per-supplier line-grain OTIF rates and the total delta
#   are all clean one-decimal numbers.
# - 3 short-shipped lines (>0 delivered) and 1 zero-delivered line, so
#   fill_rate, in_full, and stockout_count all have non-trivial values.

orders:

  # ------------------------------ 2026-02 (12 orders, 20 lines, all in full)
  - {order_id: ORD-2602-01, month: "2026-02", supplier: S1, dc: JEB, on_time: true,
