    - {sku: SKU-A, dc: JEB, days_of_cover: 45.0}
    - {sku: SKU-A, dc: AUH, days_of_cover: 12.6}
    - {sku: SKU-B, dc: JEB, days_of_cover: 24.9}
    - {sku: SKU-B, dc: AUH, days_of_cover: 15.0}
    - {sku: SKU-C, dc: JEB, days_of_cover: 15.0}
    - {sku: SKU-C, dc: AUH, days_of_cover: 7.0}
    - {sku: SKU-D, dc: JEB, days_of_cover: 8.0}
    - {sku: SKU-D, dc: AUH, days_of_cover: null}   # zero demand -> NULL, pinned
    - {sku: SKU-E, dc: JEB, days_of_cover: 7.0}
