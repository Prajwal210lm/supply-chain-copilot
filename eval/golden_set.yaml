# golden_set.yaml — 80 entries, written BEFORE any implementation exists.
#
# CLARIFICATION CRITERION (verbatim, binding):
# "Intended-clarification entries must be genuinely undecidable, cases
# where any default would be a guess a partner could challenge. Merely
# underspecified questions where a sensible default exists (e.g. a missing period)
# must be CLEAN entries that answer with the default. Underspecified-but-
# defaultable questions written as clarifications train the policy toward
# over-clarification, the exact failure the clean-slice clarification gate exists
# to catch."
#
# Matching rules for future harness code:
# - expected specs are in NORMALIZED CANONICAL form: top_n and sort explicit,
#   quarters/years already compiled to month ranges, periods fully resolved.
# - refusal entries: reason_code (and expected_reason) is the assertion;
#   message text is advisory; suggestions are scored for answerability, not text.
# - clarification entries: the options SET is the assertion (order-insensitive,
#   semantic match); question text is advisory.
# - Slice counts: clean 30, near_miss 15, multi_turn 5, clarification 5,
#   adversarial 25. Total 80.
# - Resolution defaults used by clean entries are pinned in docs/SPEC.md,
#   appendix "Resolution defaults". Anchor: now = June 2026.

entries:

  # ---------------------------------------------------------------- clean (30)

  - id: c01
    slice: clean
    question: "what was our OTIF last month"
    expected:
      spec_type: metric_query
      metric: otif_pct
      period: {grain: month, start: "2026-05", end: "2026-05"}
    notes: "Relative date: last month vs June 2026 anchor resolves to 2026-05."

  - id: c02
    slice: clean
    question: "revenue this quarter"
    expected:
      spec_type: metric_query
      metric: revenue
      period: {grain: month, start: "2026-04", end: "2026-06"}
    notes: "This quarter = Q2 2026, compiled to month range 2026-04..2026-06."

  - id: c03
    slice: clean
    question: "show monthly fill rate for last year"
    expected:
      spec_type: metric_query
      metric: fill_rate_pct
      period: {grain: month, start: "2025-01", end: "2025-12"}
      time_grain: month
    notes: "Last year = calendar 2025; 'monthly' asks for a series, so time_grain month."

  - id: c04
    slice: clean
    question: "OTIF by supplier"
    expected:
      spec_type: breakdown_query
      metric: otif_pct
      period: {grain: month, start: "2026-06", end: "2026-06"}
      dimension: supplier
      top_n: 10
      sort: desc
    notes: "Missing period -> default latest complete month 2026-06 and ANSWER, per criterion."

  - id: c05
    slice: clean
    question: "why did OTIF drop in March"
    expected:
      spec_type: change_decomposition
      metric: otif_pct
      dimension: supplier
      period_a: {grain: month, start: "2026-02", end: "2026-02"}
      period_b: {grain: month, start: "2026-03", end: "2026-03"}
    notes: "'Why' triggers decomposition; baseline is the prior month; default OTIF dimension is supplier."

  - id: c06
    slice: clean
    question: "how many orders did we get from modern trade in May"
