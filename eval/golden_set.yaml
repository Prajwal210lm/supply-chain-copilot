  # ------------------------------------------------------------ near_miss (15)

  - id: n01
    slice: near_miss
    question: "what percentage of ordered cases actually shipped last month"
    near_miss_pair: fill_rate_vs_in_full
    expected:
      spec_type: metric_query
      metric: fill_rate_pct
      period: {grain: month, start: "2026-05", end: "2026-05"}
    notes: "'Percentage of ordered cases' is a quantity ratio (fill rate), not the order-level in-full binary."

  - id: n02
    slice: near_miss
    question: "what share of orders were delivered complete in May"
    near_miss_pair: in_full_vs_fill_rate
    expected:
      spec_type: metric_query
      metric: in_full_pct
      period: {grain: month, start: "2026-05", end: "2026-05"}
    notes: "'Share of ORDERS ... complete' counts whole orders (in_full), not shipped-quantity share (fill rate)."

  - id: n03
    slice: near_miss
    question: "what fraction of orders arrived on schedule in Q1"
    near_miss_pair: on_time_vs_otif
    expected:
      spec_type: metric_query
      metric: on_time_pct
      period: {grain: month, start: "2026-01", end: "2026-03"}
    notes: "'On schedule' is timeliness only; OTIF would wrongly also require completeness."

  - id: n04
    slice: near_miss
    question: "what percent of orders were delivered both complete and on schedule in April"
    near_miss_pair: otif_vs_on_time
    expected:
      spec_type: metric_query
      metric: otif_pct
      period: {grain: month, start: "2026-04", end: "2026-04"}
    notes: "'Both complete and on schedule' is exactly the OTIF conjunction; on_time alone drops completeness."

  - id: n05
    slice: near_miss
    question: "how much of the demand did we actually fulfill in June"
    near_miss_pair: fill_rate_vs_otif
    expected:
      spec_type: metric_query
      metric: fill_rate_pct
      period: {grain: month, start: "2026-06", end: "2026-06"}
    notes: "'How much of the demand' is delivered-qty over ordered-qty (fill rate); OTIF says nothing about volume."

  - id: n06
    slice: near_miss
    question: "how much was a typical order worth in May"
    near_miss_pair: avg_order_value_vs_revenue
    expected:
      spec_type: metric_query
      metric: avg_order_value
      period: {grain: month, start: "2026-05", end: "2026-05"}
    notes: "'A typical order' is per-order value (AOV); revenue would be the monthly total."

  - id: n07
    slice: near_miss
    question: "what did modern trade bring in last quarter"
    near_miss_pair: revenue_vs_avg_order_value
    expected:
      spec_type: metric_query
      metric: revenue
      period: {grain: month, start: "2026-01", end: "2026-03"}
      filters:
        - {dimension: customer_segment, values: ["modern trade"]}
    notes: "'Bring in' is total takings (revenue), not the per-order average."

  - id: n08
    slice: near_miss
    question: "did order sizes grow this year"
    near_miss_pair: avg_order_value_vs_revenue
    expected:
      spec_type: metric_query
      metric: avg_order_value
      period: {grain: month, start: "2026-01", end: "2026-06"}
      time_grain: month
    notes: "'Order sizes' is per-order value (AOV trend); total revenue can grow while orders shrink."

  - id: n09
    slice: near_miss
    question: "how many times did we run out of stock in May"
    near_miss_pair: stockout_count_vs_days_of_cover
    expected:
      spec_type: metric_query
      metric: stockout_count
      period: {grain: month, start: "2026-05", end: "2026-05"}
    notes: "'How many times' is an event count (stockouts), not a coverage-duration measure."

  - id: n10
    slice: near_miss
    question: "how long will current stock at JEB last"
    near_miss_pair: days_of_cover_vs_stockout_count
    expected:
      spec_type: metric_query
      metric: days_of_cover
      period: {grain: month, start: "2026-06", end: "2026-06"}
      filters:
        - {dimension: dc, values: ["JEB"]}
    notes: "'How long will stock last' is forward coverage (days_of_cover); stockout_count is backward-looking events."

  - id: n11
    slice: near_miss
    question: "how often were we out of beverages in Q2"
    near_miss_pair: stockout_count_vs_days_of_cover
    expected:
      spec_type: metric_query
      metric: stockout_count
      period: {grain: month, start: "2026-04", end: "2026-06"}
      filters:
        - {dimension: category, values: ["beverages"]}
    notes: "'How often ... out' counts stockout events; days_of_cover measures remaining runway, not frequency."

  - id: n12
    slice: near_miss
    question: "ignoring shortages, how did delivery punctuality look in March"
    near_miss_pair: on_time_vs_otif
    expected:
      spec_type: metric_query
      metric: on_time_pct
      period: {grain: month, start: "2026-03", end: "2026-03"}
    notes: "'Ignoring shortages' explicitly strips the in-full leg, so OTIF is wrong by construction."

  - id: n13
    slice: near_miss
    question: "what's our perfect-order rate for 2026 so far"
    near_miss_pair: otif_vs_on_time
    expected:
      spec_type: metric_query
      metric: otif_pct
      period: {grain: month, start: "2026-01", end: "2026-06"}
    notes: "'Perfect order' is the industry term for the on-time AND in-full conjunction, i.e. OTIF."

  - id: n14
    slice: near_miss
    question: "how much stock are we sitting on at AUH"
    near_miss_pair: inventory_value_vs_days_of_cover
    expected:
      spec_type: metric_query
      metric: inventory_value
      period: {grain: month, start: "2026-06", end: "2026-06"}
      filters:
        - {dimension: dc, values: ["AUH"]}
    notes: "'How much stock' is a holdings measure (AED value), not a demand-relative duration."

  - id: n15
    slice: near_miss
    question: "is the stock at AUH enough to cover upcoming demand"
    near_miss_pair: days_of_cover_vs_inventory_value
    expected:
      spec_type: metric_query
      metric: days_of_cover
      period: {grain: month, start: "2026-06", end: "2026-06"}
      filters:
        - {dimension: dc, values: ["AUH"]}
    notes: "'Enough to cover demand' is inventory relative to consumption rate — days_of_cover, not raw value."

  # ------------------------------------------------------------ multi_turn (5)

  - id: m01
    slice: multi_turn
    context:
      - question: "monthly OTIF for 2025"
        spec:
          spec_type: metric_query
          metric: otif_pct
          period: {grain: month, start: "2025-01", end: "2025-12"}
          time_grain: month
    question: "break that down by emirate"
    expected:
      spec_type: breakdown_query
      metric: otif_pct
      period: {grain: month, start: "2025-01", end: "2025-12"}
      dimension: emirate
      top_n: 10
      sort: desc
    notes: "Full re-emission: metric and period carried from context into a complete breakdown_query, not a patch."

  - id: m02
    slice: multi_turn
    context:
      - question: "revenue by category this quarter"
        spec:
          spec_type: breakdown_query
          metric: revenue
          period: {grain: month, start: "2026-04", end: "2026-06"}
          dimension: category
          top_n: 10
          sort: desc
    question: "same thing but for last quarter"
    expected:
      spec_type: breakdown_query
      metric: revenue
      period: {grain: month, start: "2026-01", end: "2026-03"}
      dimension: category
      top_n: 10
      sort: desc
    notes: "Only the period changes; everything else re-emitted in full from context."

  - id: m03
    slice: multi_turn
    context:
      - question: "fill rate for May"
        spec:
          spec_type: metric_query
          metric: fill_rate_pct
          period: {grain: month, start: "2026-05", end: "2026-05"}
    question: "just for modern trade"
    expected:
      spec_type: metric_query
      metric: fill_rate_pct
      period: {grain: month, start: "2026-05", end: "2026-05"}
      filters:
        - {dimension: customer_segment, values: ["modern trade"]}
    notes: "Filter added on top of the carried metric and period; full spec re-emitted."

  - id: m04
    slice: multi_turn
    context:
      - question: "stockouts by dc in Q1"
        spec:
          spec_type: breakdown_query
          metric: stockout_count
          period: {grain: month, start: "2026-01", end: "2026-03"}
          dimension: dc
          top_n: 10
          sort: desc
      - question: "and Q2?"
        spec:
          spec_type: breakdown_query
          metric: stockout_count
          period: {grain: month, start: "2026-04", end: "2026-06"}
          dimension: dc
          top_n: 10
          sort: desc
    question: "why did JEB get worse between those quarters"
    expected:
      spec_type: change_decomposition
      metric: stockout_count
      dimension: supplier
      period_a: {grain: month, start: "2026-01", end: "2026-03"}
      period_b: {grain: month, start: "2026-04", end: "2026-06"}
      filters:
        - {dimension: dc, values: ["JEB"]}
    notes: "'Those quarters' resolve from context to explicit month ranges; JEB becomes a filter, default dimension supplier."

  - id: m05
    slice: multi_turn
    context:
      - question: "OTIF by supplier last month"
        spec:
          spec_type: breakdown_query
          metric: otif_pct
          period: {grain: month, start: "2026-05", end: "2026-05"}
          dimension: supplier
          top_n: 10
          sort: desc
    question: "show me just the top 3"
    expected:
      spec_type: breakdown_query
      metric: otif_pct
      period: {grain: month, start: "2026-05", end: "2026-05"}
      dimension: supplier
      top_n: 3
      sort: desc
    notes: "Only top_n changes; the full breakdown_query is re-emitted, not a {top_n: 3} patch."

  # --------------------------------------------------------- clarification (5)

  - id: q01
    slice: clarification
    question: "how are we doing on completeness"
    expected:
      spec_type: clarification
      question: "Completeness can mean two different measures — which one do you want?"
      options:
        - "in_full_pct: share of orders delivered with every line complete"
        - "fill_rate_pct: share of ordered quantity that was actually delivered"
      pending_context:
        period: {grain: month, start: "2026-06", end: "2026-06"}
    notes: "in_full and fill_rate diverge badly on partial shipments; neither default survives a partner challenge."

  - id: q02
    slice: clarification
    question: "how bad were the shortages last quarter"
    expected:
      spec_type: clarification
      question: "Do you want shortage severity as a count of events or as unfilled demand?"
      options:
        - "stockout_count: number of stockout events in Q1 2026"
        - "fill_rate_pct: share of ordered quantity delivered in Q1 2026 (the gap is the shortage)"
      pending_context:
        period: {grain: month, start: "2026-01", end: "2026-03"}
    notes: "'How bad' is genuinely two-valued (frequency vs magnitude); the period IS defaultable so it sits resolved in pending_context."

  - id: q03
    slice: clarification
    question: "compare the DCs"
    expected:
      spec_type: clarification
      question: "Compare the DCs on which measure?"
      options:
        - "otif_pct by dc"
        - "revenue by dc"
        - "inventory_value by dc"
        - "days_of_cover by dc"
      pending_context:
        dimension: dc
        period: {grain: month, start: "2026-06", end: "2026-06"}
    notes: "No metric named at all; any pick among service, sales, and stock measures is a coin flip."

  - id: q04
    slice: clarification
    question: "what's our service level this year"
    expected:
      spec_type: clarification
      question: "'Service level' is used for several measures here — which definition do you mean?"
      options:
        - "otif_pct: orders on time and in full"
        - "fill_rate_pct: ordered quantity actually delivered"
        - "in_full_pct: orders delivered complete"
      pending_context:
        period: {grain: month, start: "2026-01", end: "2026-06"}
    notes: "Replaces the prompt's weak 'deliveries getting better' candidate (OTIF is a defensible default there); 'service level' is a genuinely contested industry term with three current readings."

  - id: q05
    slice: clarification
